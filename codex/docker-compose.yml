services:
  codex:
    build:
      context: .
      additional_contexts:
        prism: ${PRISM_SRC:-../../agents_setup/features/prism}
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: d_codex
    init: true
    environment:
      COLORTERM: truecolor
      TZ: ${TZ:-Europe/Berlin}
      HOST_MCP_TOKEN: ${HOST_MCP_TOKEN:-}
      AGENT_DEVICE_DAEMON_BASE_URL: ${AGENT_DEVICE_DAEMON_BASE_URL:-}
      AGENT_DEVICE_DAEMON_AUTH_TOKEN: ${AGENT_DEVICE_DAEMON_AUTH_TOKEN:-}
      PRISM_APP_FILE: ${PRISM_APP_FILE:-}
      PRISM_APP_HOST: ${PRISM_APP_HOST:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_WORKDIR}:${CONTAINER_WORKDIR}
    working_dir: ${CONTAINER_WORKDIR}
    stdin_open: true
    tty: true
